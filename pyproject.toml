[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unicode-logic-kit"
version = "0.33.0"
description = "Parse, translate, prove and model-check logic formulas in Unicode notation: first-order, modal, description and higher-order logic, one API over a dozen provers, and an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Felix Vossel", email = "fvossel@uos.de" },
]
keywords = [
    "logic", "fol", "first-order-logic", "modal-logic", "description-logic",
    "higher-order-logic", "non-classical-logic", "theorem-proving",
    "automated-reasoning", "model-checking", "parser", "unicode", "tptp", "smt",
    "owl", "autoformalization", "nl-to-fol", "llm", "mcp", "lukasiewicz",
    "lambda-calculus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.1",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",   # parallel test runs: pytest -n auto (the suite is Z3-bound)
]
mcp = [
    # The MCP server layer (unicode_logic_kit.mcp): the seven-verb API as
    # Model Context Protocol tools for LLM agents/editors.
    # Run with: python -m unicode_logic_kit.mcp
    "mcp>=2.0,<3",
]
hf = [
    # The HuggingFace-evaluate adapter around eval.metric_hf.FolEquivalence.
    # compute_fol_metrics itself needs NEITHER of these.
    "evaluate>=0.4",
    "datasets>=2.14",
]
cvc5 = [
    # Second, independent SMT decision procedure (BSD-3). When installed, the
    # FOL default chain gains the "cvc5" backend right after "z3" — see
    # unicode_logic_kit.atp.protocol.default_chain.
    "cvc5>=1.3,<2",
]
chem = [
    # unicode_logic_kit.chem.mol_to_structure — molecules as finite FOL
    # structures. Only mol_to_structure needs RDKit; the chemical SIGNATURE,
    # the structure layer and the evaluator are all RDKit-free, so the rest
    # of unicode_logic_kit.chem imports and runs without this extra.
    "rdkit>=2023.9",
]
asp = [
    # unicode_logic_kit.atp.clingo_backend.ClingoBackend and
    # unicode_logic_kit.semantics.asp_models — a refutation-only finite-domain
    # FOL prover and a minimal-models route, both via clingo's ASP solver.
    # A pip package with the solver bundled (no separate install, unlike
    # `cp` below); ClingoBackend.available() is a pure import check. Without
    # this extra, the counting fragment (Count/Cardinality) still has no
    # decision procedure and minimal_models still goes through the
    # second-order route in semantics.nonmonotonic — nothing else regresses.
    "clingo>=5.6",
]
cp = [
    # unicode_logic_kit.atp.minizinc_backend.MinizincBackend — the same
    # refutation-only finite-domain search, via a CP solver instead of ASP.
    # The real prerequisite is a separate MiniZinc >= 2.6 CLI installation on
    # PATH (or $UFK_MINIZINC) — MinizincBackend.available() checks for that
    # binary via subprocess, the same discovery convention as Prover9Backend
    # / VampireBackend, and does not import this package. `minizinc` (the
    # official Python bindings) is pinned here as the documented companion
    # install rather than left unnamed. Without either, `minizinc` reports
    # unavailable and every other backend is unaffected.
    "minizinc>=0.9",
]
owl = [
    # unicode_logic_kit.dl.owl_reasoner — the external OWL 2 DL route: owlready2
    # drives the bundled HermiT reasoner over a whole ontology, for the
    # constructs the in-house ALCHQ(S) tableau refuses (inverse roles,
    # nominals) and as an independent oracle on the fragment it does decide.
    # HermiT is a JAR, so a JVM must be on PATH as well (Java 8 or newer);
    # owl_reasoner_available() checks for both. owlready2 is LGPL-3.0-or-later
    # (this kit is MIT): it is an optional, separately installed dependency
    # that the kit only imports, never vendors or links statically.
    "owlready2>=0.46",
]
lint = [
    # Pins mypy for the CI `typecheck` job (.github/workflows/tests.yml)
    # and its local equivalent, `python tools/mypy_ratchet.py`. An EXACT
    # pin, not a range: a moving mypy version changing its own inference is
    # a false-failure source unrelated to any code change -- same reasoning
    # as the E-prover/APE pins in tests.yml. tools/mypy_baseline.json is
    # generated against this exact version; bump both together
    # (`pip install -e .[lint]` then `python tools/mypy_ratchet.py --update`).
    "mypy==2.3.1",
]

[project.scripts]
# The command line of the package (unicode_logic_kit.__main__): a formula to
# render, the verbs check / equiv / prove / countermodel / repair / translate,
# and `unicode-logic-kit mcp`, which starts the MCP server on stdio. The name
# is the distribution's own, so `uvx unicode-logic-kit ...` finds it, and that
# is the command an MCP registry client builds from server.json.
unicode-logic-kit = "unicode_logic_kit.__main__:main"

[project.urls]
Documentation = "https://unicode-logic-kit.readthedocs.io/"
Repository = "https://github.com/fvossel/unicode-logic-kit"
Issues = "https://github.com/fvossel/unicode-logic-kit/issues"
Changelog = "https://github.com/fvossel/unicode-logic-kit/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
markers = [
    # The everyday developer loop is `pytest -n auto -m "not isabelle_live"`:
    # the live tests each spawn a fresh `isabelle build` subprocess (minutes of
    # wall time on a machine with Isabelle installed) and dominate the serial
    # suite time. CI and pre-release runs cover them with a SERIAL
    # `pytest -m isabelle_live` — even `-n 4` makes concurrent JVM builds
    # contend for CPU and push long proof batteries (S4.3 ~70 s) past their
    # session timeouts, producing flaky failures. Never put `-n` in addopts.
    #
    # Measured 2026-08-13 on a 24-core box, in case anyone is tempted again:
    # parallelism is not the bottleneck here. `-n 6` with Isabelle's session
    # timeouts scaled to match (`-o timeout_scale=6 -o threads=4`, so
    # contention could not trip them) ran 20:05 against 22:51 serial — and
    # still produced two false failures (both intuitionistic prove cases).
    # Each build gets its own scratch dir and a uuid session name, so they
    # cannot collide; what does not parallelise is per-build JVM + heap
    # startup, and scaling the timeouts also stretches the tests whose
    # expected outcome IS a timeout. Serial it is.
    "isabelle_live: exercises a real Isabelle/HOL installation via isabelle_runner (slow subprocess builds; skipped automatically when isabelle_available() is False)",
    # Same convention as isabelle_live: real HTTP calls against a real HETS server
    # (unicode_logic_kit.hets), gated by hets_available() and skipped automatically
    # when no server is reachable. Run explicitly and SERIALLY: `pytest -m hets_live`.
    "hets_live: exercises a real HETS server via unicode_logic_kit.hets (Docker-backed REST; skipped automatically when hets_available() is False)",
    # Same convention again, for the external OWL 2 DL route: each test spawns
    # HermiT in a JVM through owlready2 (see the `owl` extra), so these are
    # skipped automatically unless owl_reasoner_available() finds both. Unlike
    # isabelle_live they are seconds, not minutes, and safe under `-n`.
    "owl_live: exercises a real owlready2 + HermiT installation via unicode_logic_kit.dl.owl_reasoner (skipped automatically when owl_reasoner_available() is False)",
    # Same convention again, for the Lean 4 route: each test spawns `lean` as a
    # subprocess to elaborate (and, for a hand-written proof, kernel-check) the
    # emitted file, gated by lean_available() (checks UFK_LEAN_HOME / PATH /
    # ~/.elan/bin) and skipped automatically when no toolchain is found. Each
    # elaboration is its own short-lived process (no shared JVM/session state
    # the way Isabelle's builds have), so -- unlike isabelle_live -- these are
    # safe under `-n`.
    "lean_live: exercises a real Lean 4 installation via hol.lean (subprocess elaboration; skipped automatically when lean_available() is False)",
]

[tool.mypy]
python_version = "3.10"
packages = ["unicode_logic_kit"]
ignore_missing_imports = true
# rdkit's PEP 561 stub package (rdkit-stubs) has shipped releases whose
# generated .pyi files contain outright syntax errors (observed: a
# duplicated, misordered parameter list in Chem/rdmolfiles.pyi under rdkit
# 2026.3.5) -- a BLOCKING error that aborts mypy's whole run (exit code 2,
# before every file is even reached) and that neither ignore_errors nor a
# per-module follow_imports = "skip" override can silence (verified: both
# leave the crash in place, since the stub is parsed regardless of either
# setting). Disabling PEP 561 site-packages discovery sidesteps it: every
# third-party import then falls back to Any under ignore_missing_imports
# above, instead of being consulted for real type info. See
# tools/mypy_ratchet.py's module docstring for the full account -- this is
# a deliberate trade-off (this project's own code is checked exactly as
# strictly either way; only third-party call-signature fidelity is
# reduced), not a silent loosening of the gate itself.
no_site_packages = true

# The version of the core metadata is stated, not left to the build backend's
# default: hatchling 1.32 writes 2.5 by default, which twine 6.2 refuses
# ("'2.5' is not a valid metadata version"), so a release built on the day a
# backend moved its default would stop at `twine check`.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["unicode_logic_kit"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/unicode_logic_kit",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
exclude = [
    "/docs/_build",
    "/docs/_autosummary",
]
