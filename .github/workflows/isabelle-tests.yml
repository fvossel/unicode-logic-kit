name: Isabelle live tests

# Runs the Isabelle-backed tests on a real Linux Isabelle install — the platform
# the runner treats as its primary path (the dev box is Windows, so this is the
# guarantee that `isabelle_decide_modal` & friends actually work on Linux).
#
# Scoped to the relevant paths so it does not run on every commit; also available
# on demand via the Actions "Run workflow" button (workflow_dispatch). The Isabelle
# install is cached, so only the first run pays the ~1.2 GB download.

on:
  push:
    branches: [main]
    paths:
      - 'unicode_logic_kit/hol/**'
      - 'tests/test_isabelle_runner.py'
      - 'tests/test_isabelle_runner_live.py'
      - 'tests/test_hol_isabelle_nonmodal_live.py'
      - 'tests/test_isabelle_conditional.py'
      - 'tests/test_isabelle_relevant.py'
      - 'tests/test_isabelle_substructural.py'
      - 'tests/test_hol_matrix.py'
      - 'tests/test_completeness.py'
      - '.github/workflows/isabelle-tests.yml'
  pull_request:
    paths:
      - 'unicode_logic_kit/hol/**'
      - 'tests/test_isabelle_runner.py'
      - 'tests/test_isabelle_runner_live.py'
      - 'tests/test_hol_isabelle_nonmodal_live.py'
      - 'tests/test_isabelle_conditional.py'
      - 'tests/test_isabelle_relevant.py'
      - 'tests/test_isabelle_substructural.py'
      - 'tests/test_hol_matrix.py'
      - 'tests/test_completeness.py'
      - '.github/workflows/isabelle-tests.yml'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    # The full isabelle_live selection is ~71 serial `isabelle build` sessions
    # (~22 min on the dev box; CI runners are slower) — give it real headroom.
    timeout-minutes: 120
    env:
      ISABELLE_VERSION: Isabelle2025-2
      ISABELLE_SHA256: a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Isabelle
        id: cache-isabelle
        uses: actions/cache@v4
        with:
          path: ~/${{ env.ISABELLE_VERSION }}
          key: ${{ env.ISABELLE_VERSION }}-linux-x86_64

      - name: Download & extract Isabelle
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$HOME"
          # The TUM server has real outages, and its canonical /dist/ URL 301s to an
          # http:// CDN address that curl will not follow (protocol downgrade) — it
          # then writes a stub file and still exits 0, so a mirror loop that only
          # checks curl's exit status accepts the failure and never falls through.
          # Two consequences are handled here: the CDN is listed directly over https,
          # and the SHA256 pin is verified INSIDE the loop, so any mirror that yields
          # the wrong bytes (stub, error page, truncated transfer) moves on to the
          # next one instead of failing the whole job at the integrity gate.
          #
          # The /dist/ directory of every mirror holds the CURRENT release only: once a
          # newer Isabelle is out, the pinned one is gone from all of them (404, or a
          # redirect to nothing). Every release stays in the archive of its own website,
          # website-<version>/dist/, served over https without a redirect, so that URL
          # comes first and keeps working for a pin that is no longer current.
          urls=(
            "https://isabelle.in.tum.de/website-${ISABELLE_VERSION}/dist/${ISABELLE_VERSION}_linux.tar.gz"
            "https://dist.isabelle.cit.tum.de/dist/${ISABELLE_VERSION}_linux.tar.gz?token=Isabelle"
            "https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/${ISABELLE_VERSION}_linux.tar.gz"
            "https://isabelle.in.tum.de/dist/${ISABELLE_VERSION}_linux.tar.gz"
          )
          ok=""
          for url in "${urls[@]}"; do
            echo "Downloading $url"
            rm -f isabelle.tar.gz
            if ! curl -fSL --proto-redir =https --connect-timeout 30 \
                   --retry 3 --retry-all-errors -o isabelle.tar.gz "$url"; then
              echo "::warning::download failed from $url - trying next mirror"
              continue
            fi
            if ! echo "${ISABELLE_SHA256}  isabelle.tar.gz" | sha256sum -c -; then
              echo "::warning::checksum mismatch from $url ($(stat -c %s isabelle.tar.gz) bytes) - trying next mirror"
              continue
            fi
            ok="$url"
            break
          done
          test -n "$ok" || { echo "::error::all Isabelle mirrors failed"; exit 28; }
          tar xzf isabelle.tar.gz
          rm -f isabelle.tar.gz
          test -x "$HOME/${ISABELLE_VERSION}/bin/isabelle"

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Isabelle version
        run: |
          export PATH="$HOME/${ISABELLE_VERSION}/bin:$PATH"
          isabelle version

      - name: Run the Isabelle-backed tests
        run: |
          export PATH="$HOME/${ISABELLE_VERSION}/bin:$PATH"
          export UFK_ISABELLE_HOME="$HOME/${ISABELLE_VERSION}"
          python -c "from unicode_logic_kit.hol.isabelle_runner import find_isabelle; print('discovered:', find_isabelle())"
          # Runner unit tests first (fast, no Isabelle build), then EVERY
          # isabelle_live test in the suite — the marker selection means a new
          # live test file is covered without editing this list. SERIAL on
          # purpose: concurrent `isabelle build` JVMs contend for CPU and push
          # long proof batteries past their session timeouts (see the marker
          # comment in pyproject.toml).
          pytest -v tests/test_isabelle_runner.py
          pytest -v -m isabelle_live tests/
